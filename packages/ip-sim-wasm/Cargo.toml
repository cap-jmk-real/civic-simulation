[package]
name = "ip-sim-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "WebAssembly bindings for ip-sim-engine (market kernel)."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
wasm-bindgen = "0.2"
serde = "1.0"
serde_json = "1.0"

# Sequential kernels only — Rayon does not ship for wasm32-unknown-unknown in this setup.
ip-sim-engine = { path = "../ip-sim-engine", default-features = false }
